name: "🔐 Security Audit"
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: 🔍 Cargo Audit
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 🛠️ Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: 🔐 Security Audit
        run: cargo audit
