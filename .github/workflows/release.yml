name: 🎯 Release
on:
  workflow_run:
    workflows: ["🔍 CI - Quality & Coverage"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  release:
    name: 🎯 Create Release
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, 'chore(release)')
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: 🛠️ Install cargo-edit
        run: cargo install cargo-edit
      - name: 🔍 Debug - Current State
        run: |
          echo "=== Current Version ==="
          grep '^version' Cargo.toml | head -1
          echo ""
          echo "=== Latest Tags ==="
          git tag --sort=-v:refname | head -5
          echo ""
          echo "=== Recent Commits ==="
          git log --oneline -10
      - name: 🎨 Generate Changelog & Bump Version
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: "conventionalcommits"
          output-file: "CHANGELOG.md"
          release-count: 0
          skip-on-empty: false
          version-file: "Cargo.toml"
          version-path: "package.version"
          tag-prefix: "v"
          # This job owns every git operation; the action only computes the
          # version and writes CHANGELOG.md. It must never push: main is
          # protected by the branch-discipline ruleset (PR required, no bypass
          # actor). Tagging waits until the PR merges, so a rejected commit can
          # never leave an orphan tag behind.
          # NOTE: skip-commit also routes the version lookup to git tags, so
          # the action no longer rewrites Cargo.toml - the cargo set-version
          # step below owns that.
          skip-commit: true
          skip-tag: true
          git-push: false
      - name: 🔍 Debug - Changelog Outputs
        run: |
          echo "=== Changelog Action Outputs ==="
          echo "Skipped: ${{ steps.changelog.outputs.skipped }}"
          echo "Version: ${{ steps.changelog.outputs.version }}"
          echo "Tag: ${{ steps.changelog.outputs.tag }}"
          echo ""
          echo "=== Cargo.toml, still at the pre-bump version ==="
          grep '^version' Cargo.toml | head -1
      - name: ❌ Fail if Version is Invalid
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Version bump failed! Got: '$VERSION'"
            exit 1
          fi
          echo "✅ Valid version: $VERSION"
      - name: 🔖 Update Cargo.toml and Cargo.lock
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          cargo set-version "${{ steps.changelog.outputs.version }}"
          # The package is rusty_commit_lister; the repo is rusty-commit-lister.
          # Cargo does not normalise the two, and the wrong spelling is a hard
          # error that used to abort the whole release.
          cargo update -p rusty_commit_lister
          cargo check
      - name: 📤 Open the version-bump pull request
        id: bump_pr
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changelog.outputs.version }}
          BRANCH: release-bot/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # The branch is cut here, after the changelog action has run: the
          # action pulls the checked-out branch, which only works while main is
          # still the current branch. The file edits carry over untouched.
          git switch -c "${BRANCH}"
          git config user.name "chess-seventh"
          git config user.email "chess7th@pm.me"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          # A re-run of a job that already merged its bump has nothing to stage:
          # the version, the lock and the changelog all match main already.
          # Point at the bump commit that landed and let the tag step finish the
          # release, instead of dying on an empty commit.
          if git diff --cached --quiet; then
            # -F is not usable with the anchors, so escape the dots instead;
            # --no-merges skips the merge commit, whose default body is the pull
            # request title and therefore matches the same pattern.
            esc=$(printf '%s' "${VERSION}" | sed 's/\./\\./g')
            landed=$(git log -1 --no-merges --format=%H --grep="^chore(release): v${esc}$" main)
            if [ -z "${landed}" ]; then
              echo "::error::v${VERSION} produced no changes and no bump commit exists on main"
              exit 1
            fi
            echo "v${VERSION} already landed as ${landed}; skipping the pull request"
            echo "bump_sha=${landed}" >> "$GITHUB_OUTPUT"
            echo "already_landed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): v${VERSION}"
          git push origin "${BRANCH}"
          echo "bump_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(release): v${VERSION}" \
            --body "Automated version bump for v${VERSION}, opened and merged by the Release workflow."
      - name: 🔀 Merge the pull request
        if: steps.changelog.outputs.skipped == 'false' && steps.bump_pr.outputs.already_landed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release-bot/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Mergeability is computed asynchronously, so a merge fired straight
          # after the create can still see UNKNOWN. Wait it out.
          state=UNKNOWN
          for _ in $(seq 1 30); do
            state=$(gh pr view "${BRANCH}" --json mergeable --jq .mergeable || echo UNKNOWN)
            [ "${state}" = "MERGEABLE" ] && break
            echo "waiting for mergeability, currently ${state}"
            sleep 5
          done
          if [ "${state}" != "MERGEABLE" ]; then
            echo "::error::gave up waiting for mergeability, last state ${state}"
            exit 1
          fi
          # A merge commit, never a squash: the release tag points at the bump
          # commit, and a squash would rewrite that SHA off main's history.
          # The ruleset requires no status checks, so the merge lands at once.
          # The branch is reaped in its own step: a cleanup failure here would
          # skip the release and leave a merged bump with no tag.
          gh pr merge "${BRANCH}" --merge
      - name: ✨ Create GitHub Release
        if: steps.changelog.outputs.skipped == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.changelog.outputs.tag }}
          name: "Release ${{ steps.changelog.outputs.tag }}"
          body: ${{ steps.changelog.outputs.clean_changelog }}
          commit: ${{ steps.bump_pr.outputs.bump_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
      - name: 🧹 Delete the release branch
        if: steps.changelog.outputs.skipped == 'false' && steps.bump_pr.outputs.already_landed != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: release-bot/${{ github.run_id }}-${{ github.run_attempt }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${BRANCH}"
      - name: 📊 Release Summary
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.changelog.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.changelog.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Changelog" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.changelog.outputs.clean_changelog }}" >> $GITHUB_STEP_SUMMARY
      - name: ⏭️ Release Skipped
        if: steps.changelog.outputs.skipped == 'true'
        run: |
          echo "## ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No releasable commits found since last tag." >> $GITHUB_STEP_SUMMARY
