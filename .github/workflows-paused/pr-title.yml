# PARKED by L598: this repository is canonical on the fleet's forge now.
# GitHub Actions never reads a workflow outside `.github/workflows/`, so
# moving this file here is what disables it. Not ported: it checks a GitHub
# pull request's title via a third-party `uses:` action; on the forge,
# `bin/forge-pr` already fills a pull request's title from the lane record
# rather than checking one a human typed.
name: 🏷️ PR Title Check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: write
jobs:
  check-pr-title:
    name: 🔍 Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Check PR Title Format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          wip: false
          validateSingleCommit: false
