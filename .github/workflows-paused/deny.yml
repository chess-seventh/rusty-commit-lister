# PARKED by L598: this repository is canonical on the fleet's forge now, and
# its gate is `.forgejo/workflows/gate.yaml`. GitHub Actions never reads a
# workflow outside `.github/workflows/`, so moving this file here is what
# disables it. Not ported: it runs through a third-party `uses:` action the
# gate's `run:`-only convention rules out. `cargo deny` still works locally
# (`deny.toml` is unaffected); adding it to the forge gate is a separate
# decision, not this lane's to make.
name: "📋 Dependency Check"
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny:
    name: 🔍 Cargo Deny
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 📋 Check Dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
