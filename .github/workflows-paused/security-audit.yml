# PARKED by L598: this repository is canonical on the fleet's forge now, and
# its gate is `.forgejo/workflows/gate.yaml`. GitHub Actions never reads a
# workflow outside `.github/workflows/`, so moving this file here is what
# disables it. Not ported: it installs `cargo-audit` via a third-party
# `uses:` action the gate's `run:`-only convention rules out. `cargo audit`
# still works locally; adding it to the forge gate is a separate decision.
name: "🔐 Security Audit"
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: 🔍 Cargo Audit
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 🛠️ Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: 🔐 Security Audit
        run: cargo audit
