# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Licenses: an explicit allow-list of the permissive licenses present in the
# dependency tree. cargo-deny defaults to rejecting everything, so this file is
# required for the "Dependency Check" CI job to pass. Copyleft licenses
# (LGPL/MPL/BSL) are intentionally omitted: every crate that offers them also
# offers a permissive option (MIT / Apache-2.0), which cargo-deny selects.

[advisories]
# RustSec advisories are also scanned by the separate cargo-audit CI job.
yanked = "deny"

[bans]
# Duplicate transitive versions are common and not worth failing CI over.
multiple-versions = "allow"

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "WTFPL",
  "Zlib"
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
